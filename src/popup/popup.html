<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Zen Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="../../icons/icon-48.png" width="36" height="36" alt="Chess Zen Mode logo: a relaxed green pawn in a hot tub">
      <div>
        <h1>Chess Zen Mode</h1>
        <p class="tagline">Focus on the board</p>
      </div>
    </div>
    <p id="status" class="status" aria-live="polite"></p>
  </header>

  <section aria-labelledby="h-online">
    <h2 id="h-online">Online Chess</h2>
    <label class="row"><span>Online Zen Mode</span><input type="checkbox" data-path="online.enabled"></label>
    <label class="row sub"><span>Show Left Sidebar</span><input type="checkbox" data-path="online.showLeft"></label>
    <label class="row sub"><span>Show Right Panel</span><input type="checkbox" data-path="online.showRight"></label>
  </section>

  <section aria-labelledby="h-daily">
    <h2 id="h-daily">Daily Chess</h2>
    <label class="row"><span>Daily Chess Zen Mode</span><input type="checkbox" data-path="daily.enabled"></label>
    <label class="row sub"><span>Show Left Sidebar</span><input type="checkbox" data-path="daily.showLeft"></label>
    <label class="row sub"><span>Show Right Panel</span><input type="checkbox" data-path="daily.showRight"></label>
  </section>

  <section aria-labelledby="h-puzzle">
    <h2 id="h-puzzle">Puzzles</h2>
    <label class="row"><span>Puzzle Zen Mode</span><input type="checkbox" data-path="puzzle.enabled"></label>
    <label class="row sub"><span>Show Left Sidebar</span><input type="checkbox" data-path="puzzle.showLeft"></label>
    <label class="row sub"><span>Show Right Panel</span><input type="checkbox" data-path="puzzle.showRight"></label>
    <label class="row sub"><span>Show Puzzle Stats</span><input type="checkbox" data-path="puzzle.showStats"></label>
  </section>

  <section aria-labelledby="h-analysis">
    <h2 id="h-analysis">Analysis Board</h2>
    <label class="row"><span>Analysis Zen Mode</span><input type="checkbox" data-path="analysis.enabled"></label>
    <label class="row sub"><span>Show Left Sidebar</span><input type="checkbox" data-path="analysis.showLeft"></label>
    <label class="row sub"><span>Show Analysis Panel</span><input type="checkbox" data-path="analysis.showRight"></label>
    <p class="hint">The panel holds Chess.com's engine toggle and lines. If hidden or the window is narrow, use the toggle on the right edge of the page.</p>
  </section>

  <section aria-labelledby="h-look">
    <h2 id="h-look">Appearance</h2>
    <div class="row">
      <label for="bg"><span>Background Color</span></label>
      <span class="color">
        <input type="color" id="bg" value="#000000">
        <button type="button" id="reset" title="Reset to black">Default</button>
      </span>
    </div>
  </section>

  <script src="../lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
